[project]
name = "whale-segmentation"
version = "0.1.0"
description = "Pipeline para segmentação de baleias em imagens/vídeos usando modelos promptáveis (SAM2 e futuros)."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Alexandre Coelho" }
]

dependencies = [
    "ultralytics>=8.3.0",
    "opencv-python>=4.9.0",
    "numpy>=1.26.0",
    "matplotlib>=3.8.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
whale-segmentation = "whale_segmentation.__main__:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]